name: poll

# Vercel Hobby plans only allow daily Cron jobs, so scheduling lives here.
# The repository is public, which makes Actions free.
#
# GitHub's shortest scheduled interval is 5 minutes, so each run holds the
# cadence by calling /api/cron/poll every 30 seconds for ~4.5 minutes; the
# endpoint self-throttles to the session's interval anyway, so extra calls
# return immediately. Set APP_URL and CRON_SECRET as repository config:
#   gh variable set APP_URL --body "https://<production-domain>"
#   gh secret set CRON_SECRET --body "<same value as Vercel CRON_SECRET>"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Poll every 30 seconds
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Set the APP_URL repository variable and CRON_SECRET secret." >&2
            exit 1
          fi

          endpoint="${APP_URL%/}/api/cron/poll"
          deadline=$(( $(date +%s) + 270 ))
          attempts=0
          failures=0

          while [ "$(date +%s)" -lt "${deadline}" ]; do
            attempts=$((attempts + 1))
            if status=$(curl -sS -o body.json -w "%{http_code}" \
                 -H "Authorization: Bearer ${CRON_SECRET}" "${endpoint}"); then
              :
            else
              status=000
            fi
            echo "attempt ${attempts}: HTTP ${status}"
            if [ -s body.json ]; then head -c 400 body.json; echo; fi
            [ "${status}" = "200" ] || failures=$((failures + 1))
            [ "$(date +%s)" -lt "${deadline}" ] || break
            sleep 30
          done

          # Every call failing means auth or routing is broken — surface it.
          if [ "${attempts}" -gt 0 ] && [ "${failures}" -eq "${attempts}" ]; then
            echo "All ${attempts} calls failed." >&2
            exit 1
          fi
          echo "completed ${attempts} calls (${failures} failed)"
